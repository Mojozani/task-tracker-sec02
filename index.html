<!-- Git Vs Github
    final.js, final_v2.js, really_final.js

    Git is a version control system -> helps programmer:
    . track changes
    . save progress
    . create checkpoints, logs (date and time and comment of what changed)

    Mac, Linux -> already installed
    Windows -> git-scm.com
    git config --global user.name "John Doe"
    git config --global user.email johndoe@example.com

    . ideally you want these to be the same as your id on github

    repo -> another name for a folder
    staging -> files we set to be logged in the checkpoint

    green gutter -> line was added
    blue gutter -> line was changed
    red traingle -> line was deleted

    Github -> cloud platform of version control software, collaborate with others
    added stuff to github

    . Clone downloads a repository to your computer
    . Push uploads local commits
    . pull gets other collaborators updates and brings it into your local repo
    . Pull request proposes merging changes between branches or repositories
    . Merge combines content from different branches
    . Fork copies a repository on GitHub
-->

<!DOCTYPE html>
<html>
    <head>

    </head>

    <body>
        <form id="task-form">
            <fieldset>
            <legend>My Task Tracker</legend>
            <label>Task: </label>
            <input type="text" id="task-desc">
            <input type="submit" value="+">
            <input type="reset" value="-">
            </fieldset>
        </form>

        <table>
            <thead>
                <tr>
                    <th>Task #</th>
                    <th>Task Desc.</th>
                </tr>
            </thead>
            <tbody id="table-body">

            </tbody>
        </table>

        <script>
            const taskForm  = document.getElementById("task-form");
            const taskDesc  = document.getElementById("task-desc");
            const tableBody = document.getElementById("table-body");

            let counter = 0;
            function submitHandler(event) {
                event.preventDefault();
                counter++;
                const tr = document.createElement("tr");
                const td1 = document.createElement("td");
                const td2 = document.createElement("td");
                tr.appendChild(td1);
                tr.appendChild(td2);
                tableBody.appendChild(tr);
                td1.innerText = counter;
                td2.innerText = taskDesc.value;
            }

            taskForm.addEventListener("submit", submitHandler);
        </script>

    </body>

</html>
